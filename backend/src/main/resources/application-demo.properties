# Optional local demo profile that uses an in-memory database (no PostgreSQL required).
spring.datasource.url=jdbc:h2:mem:inventory_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8080

# Demo credentials: override these environment variables before sharing/deploying.
app.security.admin-username=${INVENTORY_ADMIN_USERNAME:admin}
app.security.admin-password=${INVENTORY_ADMIN_PASSWORD:ChangeMeAdmin123!}
app.security.employee-username=${INVENTORY_EMPLOYEE_USERNAME:employee}
app.security.employee-password=${INVENTORY_EMPLOYEE_PASSWORD:ChangeMeEmployee123!}

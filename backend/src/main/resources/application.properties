spring.application.name=inventory-management
server.port=8080

# Local PostgreSQL defaults. Override DB_URL / DB_USERNAME / DB_PASSWORD for hosted deployment.
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=postgres
spring.datasource.password=asdf
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always

# Demo accounts: replace with strong unique environment values before public deployment.
app.security.admin-username=admin
app.security.admin-password=Admin123
app.security.employee-username=employee
app.security.employee-password=Employee123

# Optional Brevo SMTP notifications. Keep disabled until credentials and a permitted sender are configured.
app.notifications.enabled=true
app.notifications.recipient=hemanthpaluri55@gmail.com
app.notifications.from=hemanthpaluri22@gmail.com
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


spring.application.name=inventory-management
server.port=${PORT:8080}

# =========================================================
# PostgreSQL Database
# Local defaults are used only when environment variables
# are not supplied. Render should provide all three values.
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Do not expose exception messages to public clients.
server.error.include-message=never

# =========================================================
# Admin / Employee Authentication
# Set strong, unique environment variables in Render.
# =========================================================

app.security.admin-username=${INVENTORY_ADMIN_USERNAME:admin}
app.security.admin-password=${INVENTORY_ADMIN_PASSWORD:Admin123}
app.security.employee-username=${INVENTORY_EMPLOYEE_USERNAME:employee}
app.security.employee-password=${INVENTORY_EMPLOYEE_PASSWORD:Employee123}

# =========================================================
# Email Notifications - Brevo SMTP
# =========================================================

app.notifications.enabled=${INVENTORY_EMAIL_NOTIFICATIONS_ENABLED:false}
app.notifications.recipient=${INVENTORY_ALERT_EMAIL_TO:}
app.notifications.from=${INVENTORY_ALERT_EMAIL_FROM:}

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================
# CORS - Restrict access to your deployed frontend.
# Update CORS_ALLOWED_ORIGINS in Render after Vercel deploy.
# =========================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
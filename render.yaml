services:
  - type: web
    name: stockpilot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INVENTORY_ADMIN_USERNAME
        sync: false
      - key: INVENTORY_ADMIN_PASSWORD
        sync: false
      - key: INVENTORY_EMPLOYEE_USERNAME
        sync: false
      - key: INVENTORY_EMPLOYEE_PASSWORD
        sync: false
      - key: INVENTORY_EMAIL_NOTIFICATIONS_ENABLED
        value: "false"
      - key: INVENTORY_ALERT_EMAIL_TO
        sync: false
      - key: INVENTORY_ALERT_EMAIL_FROM
        sync: false
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"

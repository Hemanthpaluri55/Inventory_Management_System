services:
  - type: web
    name: stockpilot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: INVENTORY_ADMIN_USERNAME
        sync: false
      - key: INVENTORY_ADMIN_PASSWORD
        sync: false
      - key: INVENTORY_EMPLOYEE_USERNAME
        sync: false
      - key: INVENTORY_EMPLOYEE_PASSWORD
        sync: false
